name: Test Integration

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Home Assistant targets Python versions:
        python-version: ["3.13","3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Run Pytest
        run: uv run --python ${{ matrix.python-version }} pytest tests/ --cov=custom_components.tibber_prices --cov-report=xml
