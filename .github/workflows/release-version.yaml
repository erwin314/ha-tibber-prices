name: Release Version

on:
  workflow_dispatch:
    inputs:
      new_version:
        description: 'New version (do not include v prefix, e.g. 1.2.3)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Update Version Strings
        run: |
          # Update pyproject.toml
          uv version "${{ github.event.inputs.new_version }}"
          
          # Update manifest.json via sync script
          uv run sync_version.py
          
          # Refresh the lockfile so it matches the new version
          uv lock

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add pyproject.toml uv.lock custom_components/tibber_prices/manifest.json
          git commit -m "chore: release v${{ github.event.inputs.new_version }}"
          
          # Push the code change first
          git push origin main
          
          # Create the tag on the commit we just pushed
          git tag "v${{ github.event.inputs.new_version }}"
          git push origin "v${{ github.event.inputs.new_version }}"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.event.inputs.new_version }}" \
            --title "Release v${{ github.event.inputs.new_version }}" \
            --notes "Release v${{ github.event.inputs.new_version }}" \
            --draft=false \
            --prerelease=false
