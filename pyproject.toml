[project]
name = "ha-tibber-prices"
version = "1.0.4"
description = "Tibber Prices Custom Integration for Home Assistant"
readme = "README.md"
requires-python = ">=3.13.2"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-homeassistant-custom-component>=0.13.315",
    "ruff>=0.15.1",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]             # Ignore line length violations (let formatter handle it)
